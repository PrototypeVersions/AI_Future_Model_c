name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Invariants and Python/JS parity
        run: python -m unittest discover -s tests -v
      - name: Analysis runs end to end
        run: python -m aifm.analysis --quick --out /tmp/results.json
      - name: Site data matches the parameter spec
        run: |
          cmp aifm/data/parameters.json docs/data/parameters.json
          cmp aifm/data/references.json docs/data/references.json
